[project]
name = "backblaze-disk-failure"
version = "0.1.0"
description = "Predictive maintenance project using Backblaze hard drive SMART data."
requires-python = ">=3.12"

dependencies = [
    "duckdb",
    "pandas",
    "pyarrow",
    "requests",
]

[project.optional-dependencies]
dev = [
    "ruff",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]