[project]
name = "backblaze-disk-failure"
version = "0.1.0"
description = "Predictive maintenance project using Backblaze hard drive SMART data."
requires-python = ">=3.12"

dependencies = [
    "duckdb",
    "lightgbm",
    "matplotlib",
    "pandas",
    "pyarrow",
    "requests",
    "scikit-learn",
    "shap",
]

[project.optional-dependencies]
dev = [
    "ruff",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning:joblib.numpy_pickle",
]